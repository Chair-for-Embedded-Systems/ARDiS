[project]
name = "ardis"
version = "1.0.0"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "ardis-daemon @ git+https://gitlab.kit.edu/uhqql/ardis-daemon.git@v1.0.0",
]


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
ardis-config = "ardis.utils.autoconfig.run:main"

[tool.setuptools.packages.find]
include = ["ardis*"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[project.urls]
"Repository" = "https://github.com/Chair-for-Embedded-Systems/ARDiS"
"Issues" = "https://github.com/Chair-for-Embedded-Systems/ARDiS/issues"
"Changelog" = "https://github.com/Chair-for-Embedded-Systems/ARDiS/blob/main/CHANGELOG.md"